services:
  postgres:
    image: postgres:18.4-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: inside
      POSTGRES_USER: inside
      POSTGRES_PASSWORD: inside
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
